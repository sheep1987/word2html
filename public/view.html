<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容列表</title>
    <!-- 引入 CSS 文件 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/view.css">
    <!-- 调试脚本 -->
    <script>
        // 添加调试消息
        console.log('view页面开始加载');
        window.onload = function() {
            console.log('view页面完成加载');
        };
    </script>
    <!-- 引入 FCKEditor -->
    <script src="fckeditor/fckeditor.js"></script>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <p>加载中...</p>
        </div>
        
        <div id="contentContainer" style="display: none;">
            <h1 id="title"></h1>
            
            <div class="meta-info">
                <div class="meta-item">
                    <strong>项目类型:</strong>
                    <span id="category"></span>
                </div>
                
                <div class="meta-item">
                    <strong>创建时间:</strong>
                    <span id="createdAt"></span>
                </div>
            </div>
            
            <div class="content-container">
                <div class="content" id="content"></div>
                <div class="edit-container">
                    <textarea id="editor" name="editor" style="display:none"></textarea>
                    <div id="editorDiv" style="width:100%;height:500px;"></div>
                </div>
            </div>
            
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='history.html'">返回列表</button>
                <button class="btn-edit" id="editButton">编辑内容</button>
                <button class="btn-save" id="saveButton" style="display: none;">保存修改</button>
                <button class="btn-cancel" id="cancelButton" style="display: none;">取消编辑</button>
                <button class="btn-delete" id="deleteButton">删除内容</button>
            </div>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <!-- 删除确认对话框 -->
    <div class="confirm-dialog" id="deleteConfirmDialog">
        <div class="confirm-dialog-content">
            <h3>确认删除</h3>
            <p>您确定要删除这条内容吗？此操作不可恢复。</p>
            <div class="confirm-dialog-buttons">
                <button id="confirmDeleteButton" class="btn-delete">确认删除</button>
                <button id="cancelDeleteButton">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量存储当前内容
        let currentContent = {};
        let editorInitialized = false;
        let oFCKeditor = null; // 存储编辑器实例
        
        document.addEventListener('DOMContentLoaded', function() {
            // 从 URL 获取文章 ID
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const editMode = urlParams.get('edit');
            
            if (!id) {
                showError('未找到内容 ID');
                return;
            }
            
            // 从服务器获取内容
            fetch(`/api/get-content/${id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络请求失败');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        currentContent = data.data;
                        displayContent(data.data);
                        setupEditButtons();
                        setupDeleteButton();
                        
                        // 如果URL中有edit=true参数，自动进入编辑模式
                        if (editMode === 'true') {
                            document.getElementById('editButton').click();
                        }
                    } else {
                        showError(data.message || '获取内容失败');
                    }
                })
                .catch(error => {
                    showError(error.message);
                })
                .finally(() => {
                    document.getElementById('loading').style.display = 'none';
                });
        });
        
        // 显示内容
        function displayContent(data) {
            console.log('显示内容:', data);
            
            // 设置标题
            document.getElementById('title').textContent = data.title;
            document.title = data.title + ' - 查看富文本内容';
            
            // 设置项目类型
            document.getElementById('category').textContent = data.category || '未分类';
            
            // 设置创建时间
            const date = new Date(data.created_at);
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
            document.getElementById('createdAt').textContent = formattedDate;
            
            // 设置内容
            document.getElementById('content').innerHTML = data.content;
            
            // 确保editor的value也设置了，以便初始化FCKEditor时能正确读取
            document.getElementById('editor').value = data.content;
            
            // 显示内容容器
            document.getElementById('contentContainer').style.display = 'block';
        }
        
        // 设置编辑按钮
        function setupEditButtons() {
            const editButton = document.getElementById('editButton');
            const saveButton = document.getElementById('saveButton');
            const cancelButton = document.getElementById('cancelButton');
            const deleteButton = document.getElementById('deleteButton');
            const container = document.getElementById('contentContainer');
            
            // 点击编辑按钮
            editButton.addEventListener('click', function() {
                console.log('编辑按钮被点击，当前内容：', currentContent);
                container.classList.add('edit-mode');
                editButton.style.display = 'none';
                deleteButton.style.display = 'none';
                saveButton.style.display = 'inline-block';
                cancelButton.style.display = 'inline-block';
                
                // 初始化编辑器
                if (!editorInitialized) {
                    console.log('首次初始化编辑器');
                    initFCKEditor();
                } else {
                    console.log('编辑器已经初始化，直接设置内容');
                    // 确保编辑器完全准备好再设置内容
                    setTimeout(function() {
                        try {
                            if (typeof FCKeditorAPI !== 'undefined' && FCKeditorAPI.GetInstance('editor')) {
                                setEditorContent(currentContent.content);
                            } else {
                                console.error('编辑器实例未找到，尝试重新初始化');
                                editorInitialized = false;
                                initFCKEditor();
                            }
                        } catch (e) {
                            console.error('设置内容时出错，尝试重新初始化编辑器', e);
                            editorInitialized = false;
                            initFCKEditor();
                        }
                    }, 300);
                }
            });
            
            // 点击保存按钮
            saveButton.addEventListener('click', function() {
                saveContent();
            });
            
            // 点击取消按钮
            cancelButton.addEventListener('click', function() {
                container.classList.remove('edit-mode');
                editButton.style.display = 'inline-block';
                deleteButton.style.display = 'inline-block';
                saveButton.style.display = 'none';
                cancelButton.style.display = 'none';
            });
        }
        
        // 设置删除按钮
        function setupDeleteButton() {
            const deleteButton = document.getElementById('deleteButton');
            const confirmDeleteButton = document.getElementById('confirmDeleteButton');
            const cancelDeleteButton = document.getElementById('cancelDeleteButton');
            const deleteConfirmDialog = document.getElementById('deleteConfirmDialog');
            
            // 点击删除按钮
            deleteButton.addEventListener('click', function() {
                deleteConfirmDialog.style.display = 'flex';
            });
            
            // 点击确认删除按钮
            confirmDeleteButton.addEventListener('click', function() {
                deleteContent();
            });
            
            // 点击取消删除按钮
            cancelDeleteButton.addEventListener('click', function() {
                deleteConfirmDialog.style.display = 'none';
            });
        }
        
        // 初始化 FCKEditor 编辑器
        function initFCKEditor() {
            console.log('开始初始化FCKEditor...');
            try {
                // 检查FCKEditor是否正确加载
                if (typeof FCKeditor === 'undefined') {
                    console.error('FCKEditor未加载!');
                    showMessage('富文本编辑器加载失败，请刷新页面重试', 'error');
                    return;
                }
                
                // 初始化 FCKEditor
                oFCKeditor = new FCKeditor('editor');
                oFCKeditor.BasePath = 'fckeditor/';
                oFCKeditor.Height = 500;
                oFCKeditor.ToolbarSet = 'Default';
                oFCKeditor.Value = currentContent.content || '';
                oFCKeditor.ReplaceTextarea();
                
                // 添加等待编辑器加载完成的检查
                const checkEditorLoaded = setInterval(function() {
                    try {
                        if (typeof FCKeditorAPI !== 'undefined' && FCKeditorAPI.GetInstance('editor')) {
                            clearInterval(checkEditorLoaded);
                            console.log('FCKEditor已完全加载，设置内容');
                            
                            // 确保内容在编辑器完全加载后设置
                            setTimeout(function() {
                                setEditorContent(currentContent.content || '');
                            }, 500);
                            
                            editorInitialized = true;
                        }
                    } catch (e) {
                        console.log('等待编辑器加载...');
                    }
                }, 100);
                
                console.log('FCKEditor初始化调用完成');
            } catch (error) {
                console.error('初始化FCKEditor时出错:', error);
                showMessage('富文本编辑器初始化出错: ' + error.message, 'error');
            }
        }
        
        // 获取编辑器内容
        function getEditorContent() {
            try {
                if (typeof FCKeditorAPI === 'undefined') {
                    console.error('FCKeditorAPI未定义');
                    return '';
                }
                
                const editor = FCKeditorAPI.GetInstance('editor');
                if (!editor) {
                    console.error('无法获取编辑器实例');
                    return '';
                }
                
                const content = editor.GetHTML();
                console.log('成功获取编辑器内容，长度:', content.length);
                return content;
            } catch (error) {
                console.error('获取编辑器内容失败:', error);
                return '';
            }
        }
        
        // 设置编辑器内容
        function setEditorContent(content) {
            try {
                console.log('尝试设置编辑器内容，内容长度:', (content || '').length);
                
                if (typeof FCKeditorAPI === 'undefined') {
                    console.error('FCKeditorAPI未定义');
                    return;
                }
                
                const editor = FCKeditorAPI.GetInstance('editor');
                if (!editor) {
                    console.error('无法获取编辑器实例');
                    return;
                }
                
                editor.SetHTML(content || '');
                console.log('编辑器内容设置成功');
            } catch (error) {
                console.error('设置编辑器内容失败:', error);
            }
        }
        
        // 保存内容到数据库
        function saveContent() {
            const updatedContent = getEditorContent();
            
            if (!updatedContent.trim()) {
                showMessage('内容不能为空', 'error');
                return;
            }
            
            // 构建要发送的数据
            const data = {
                id: currentContent.id,
                title: currentContent.title,
                category: currentContent.category,
                content: updatedContent
            };
            
            // 发送到后端
            fetch('/api/update-content', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 更新当前页面内容
                    currentContent.content = updatedContent;
                    document.getElementById('content').innerHTML = updatedContent;
                    
                    // 退出编辑模式
                    document.getElementById('contentContainer').classList.remove('edit-mode');
                    document.getElementById('editButton').style.display = 'inline-block';
                    document.getElementById('deleteButton').style.display = 'inline-block';
                    document.getElementById('saveButton').style.display = 'none';
                    document.getElementById('cancelButton').style.display = 'none';
                    
                    showMessage('内容已成功更新！', 'success');
                } else {
                    showMessage('保存失败：' + data.message, 'error');
                }
            })
            .catch((error) => {
                showMessage('发生错误：' + error.message, 'error');
            });
        }
        
        // 删除内容
        function deleteContent() {
            fetch('/api/delete-content/' + currentContent.id, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 隐藏确认对话框
                    document.getElementById('deleteConfirmDialog').style.display = 'none';
                    
                    // 显示成功消息
                    showMessage('内容已成功删除！', 'success');
                    
                    // 2秒后重定向到列表页
                    setTimeout(() => {
                        window.location.href = 'history.html';
                    }, 2000);
                } else {
                    document.getElementById('deleteConfirmDialog').style.display = 'none';
                    showMessage('删除失败：' + data.message, 'error');
                }
            })
            .catch((error) => {
                document.getElementById('deleteConfirmDialog').style.display = 'none';
                showMessage('发生错误：' + error.message, 'error');
            });
        }
        
        // 显示错误消息
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            
            const messageElement = document.getElementById('message');
            messageElement.textContent = message;
            messageElement.className = 'message error';
            messageElement.style.display = 'block';
        }
        
        // 显示消息
        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = 'message ' + type;
            messageElement.style.display = 'block';
            
            // 5秒后自动隐藏消息
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
